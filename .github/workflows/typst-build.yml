name: Build And Deploy Resume PDFs

on:
  push:
    branches:
      - main
    paths:
      - "**.typ"
      - ".github/workflows/typst-build.yml"
      - "resume-template.typ"
      - "shashin.jpg"
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install Typst
        uses: typst-community/setup-typst@v3

      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fonts-noto-cjk \
            fonts-noto-cjk-extra \
            fonts-noto-color-emoji

      - name: Refresh font cache
        run: fc-cache -fv

      - name: Build PDFs for Pages
        run: |
          mkdir -p dist/pdfs
          typst compile 算法.typ dist/pdfs/resume-algo.pdf
          typst compile 嵌入式.typ dist/pdfs/resume-embedded.pdf
          typst compile 机器人.typ dist/pdfs/resume-robot.pdf

      - name: Prepare site
        run: |
          cp -r site/* dist/

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdfs
          path: dist/pdfs/*.pdf
          if-no-files-found: error
          compression-level: 0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
